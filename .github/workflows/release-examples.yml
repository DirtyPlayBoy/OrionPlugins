name: Release example plugins

on:
  push:
    tags:
      - "examples-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. examples-v0.1.0)"
        required: true
        default: "examples-v0.1.0"

permissions:
  contents: write

jobs:
  pack-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pack examples
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .dist | Out-Null
          $examples = @("calculator","unit-converter","quick-notes","dice-roller","hello-orion")
          foreach ($name in $examples) {
            $folder = Join-Path "examples" $name
            if (-not (Test-Path $folder)) { continue }
            $env:PLUGIN_NAME = $name
            python -c @"
          import hashlib, zipfile, re, os
          from pathlib import Path
          name = os.environ['PLUGIN_NAME']
          folder = Path('examples') / name
          raw = (folder / 'plugin.toml').read_text(encoding='utf-8')
          m = re.search(r'(?m)^id\s*=\s*\"([^\"]+)\"', raw)
          v = re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', raw)
          pid = m.group(1) if m else name
          ver = v.group(1) if v else '0.1.0'
          out = Path('.dist') / f'{pid}-{ver}-windows-x64.orionplugin'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in folder.rglob('*'):
                  if not path.is_file():
                      continue
                  if any(p in {'.git','.venv','__pycache__','node_modules','data'} for p in path.parts):
                      continue
                  zf.write(path, arcname=str(path.relative_to(folder)).replace('\\','/'))
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_suffix(out.suffix + '.sha256').write_text(digest + '\n', encoding='utf-8')
          print(out.name, digest)
          "@
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Orion example plugins ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Official example plugins for Orion (calculator, unit-converter, quick-notes, …).

            **Install:** Orion → Плагины → Каталог → Примеры
            **Auto-update:** CRM → Watchlist → `DirtyPlayBoy/OrionPlugins` + Poll GitHub
          files: |
            .dist/*.orionplugin
            .dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
