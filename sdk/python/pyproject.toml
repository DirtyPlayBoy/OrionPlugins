[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-plugin-sdk"
version = "0.2.0"
description = "Official Python SDK for Orion desktop assistant plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Orion Team" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/DirtyPlayBoy/OrionPlugins"
Documentation = "https://github.com/DirtyPlayBoy/OrionPlugins/tree/main/docs"

[tool.setuptools.packages.find]
include = ["orion_plugin_sdk*"]
